services:
  linkedin-kemenkes:
    image: "linkedin-kemenkes"
    build: .
    container_name: linkedin-kemenkes
    restart: on-failure:5
    init: true
    shm_size: "258mb"
    mem_limit: 1.2g
    cpus: 1
    ports:
      - "1564:1564"
    env_file:
      - .env
    environment:
      - TYPE=keyword
      - CLIENT_ID=50221 # PINDAHAN DB -- pastikan cocok dengan client_id akun di MongoDB
      - LIMIT=300
      - SOURCE=linkedin
      - ID_TARGET=1
      - VM=VM-CRAWLING-KEMENKES
      - PORT=1564
      - CHROME_PROFILE_ROOT=/app/chrome_profiles
      - RESTART_DRIVER_EVERY_N_KEYWORDS=9
    volumes:
      - /home/promtail/:/logs
      - /data/chrome_profiles/client_50312:/app/chrome_profiles/client_50312
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1562/status"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
